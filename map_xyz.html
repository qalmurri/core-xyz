<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAGERPOL 3D - Microservices API</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #030712;
        font-family: sans-serif;
      }

      canvas {
        display: block;
      }

      #toggleBtn {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 8px 14px;
        background: #38bdf8;
        color: #030712;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
      }

      #infoPanel {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 10;
        padding: 10px 14px;
        background: #0f172a;
        color: #fff;
        border: 1px solid #38bdf8;
        border-radius: 6px;
        font-size: 12px;
        display: none;
        transform: translate(-50%, -125%);
        pointer-events: none;
        white-space: nowrap;
      }

      #infoPanel h4 {
        color: #38bdf8;
        margin-bottom: 4px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  </head>

  <body>
    <button id="toggleBtn">Tampilkan Kubus</button>
    <div id="infoPanel">
      <p id="infoText">Memuat data...</p>
    </div>

    <script>
      // Memisahkan URL Endpoint berdasarkan Arsitektur Microservices
      const MAP_API_URL = "http://localhost:8081/api/v1/map/nodes"; // Backend 1 (Port 8081)
      const DETAIL_API_URL = "http://localhost:8080/api/v1/map/node"; // Backend 2 (Port 8080)

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x030712);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(28, 22, 36);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const clock = new THREE.Clock();
      const GRID_SIZE = 20;

      const gridPositions = [];
      const baseBoxGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
      const baseEdgesGeo = new THREE.EdgesGeometry(baseBoxGeo);
      const posAttr = baseEdgesGeo.attributes.position;

      for (let x = -GRID_SIZE; x <= GRID_SIZE; x++) {
        for (let y = -GRID_SIZE; y <= GRID_SIZE; y++) {
          for (let z = -GRID_SIZE; z <= GRID_SIZE; z++) {
            for (let i = 0; i < posAttr.count; i++) {
              gridPositions.push(
                posAttr.getX(i) + x,
                posAttr.getY(i) + y,
                posAttr.getZ(i) + z,
              );
            }
          }
        }
      }

      const singleGridGeo = new THREE.BufferGeometry();
      singleGridGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(gridPositions, 3),
      );
      const lineMat = new THREE.LineBasicMaterial({
        color: 0x38bdf8,
        transparent: true,
        opacity: 0.05,
      });
      const gridMesh = new THREE.LineSegments(singleGridGeo, lineMat);
      gridMesh.visible = false;
      scene.add(gridMesh);

      const ringGeo = new THREE.RingGeometry(0.5, 0.56, 16);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x38bdf8,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.85,
      });
      const selectionRing = new THREE.Mesh(ringGeo, ringMat);
      selectionRing.rotation.x = Math.PI / 2;
      selectionRing.visible = false;
      scene.add(selectionRing);

      const baseGeo = new THREE.SphereGeometry(0.48, 14, 14);
      const baseMat = new THREE.MeshBasicMaterial({ color: 0xff4757 });
      const tambangMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      const patrolGeo = new THREE.SphereGeometry(0.08, 8, 8);

      const LEVEL_SCALES = { 1: 0.35, 2: 0.55, 3: 0.75, 4: 1.0 };
      const materialCache = {};

      function getPatrolMaterial(colorValue) {
        if (!materialCache[colorValue]) {
          materialCache[colorValue] = new THREE.MeshBasicMaterial({
            color: colorValue,
          });
        }
        return materialCache[colorValue];
      }

      const clickableObjects = [];
      const activePatrols = [];

      // --- WEBSOCKET ELIXIR (LALU LINTAS) ---
      const trafficSocket = new WebSocket(
        "ws://127.0.0.1:4000/socket/websocket?vsn=2.0.0",
      );
      const activeRoutes = [];

      const fleetGeo = new THREE.SphereGeometry(0.14, 10, 10);
      const fleetMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
      const dashedLineMat = new THREE.LineDashedMaterial({
        color: 0x00ffcc,
        dashSize: 0.3,
        gapSize: 0.2,
        transparent: true,
        opacity: 0.6,
      });

      trafficSocket.onopen = () => {
        const joinMsg = JSON.stringify([
          "1",
          "1",
          "traffic:lobby",
          "phx_join",
          {},
        ]);
        trafficSocket.send(joinMsg);
      };

      trafficSocket.onmessage = (event) => {
        const [joinRef, ref, topic, eventName, payload] = JSON.parse(
          event.data,
        );
        if (eventName === "new_route") {
          const fromVec = new THREE.Vector3(
            payload.from.x,
            payload.from.y,
            payload.from.z,
          );
          const toVec = new THREE.Vector3(
            payload.to.x,
            payload.to.y,
            payload.to.z,
          );

          const fleetMesh = new THREE.Mesh(fleetGeo, fleetMat);
          scene.add(fleetMesh);

          const lineGeo = new THREE.BufferGeometry().setFromPoints([
            fromVec,
            toVec,
          ]);
          const lineMesh = new THREE.Line(lineGeo, dashedLineMat);
          lineMesh.computeLineDistances();
          scene.add(lineMesh);

          activeRoutes.push({
            fleet: fleetMesh,
            line: lineMesh,
            from: fromVec,
            to: toVec,
            startTime: payload.start_time,
            durationMs: payload.duration * 1000,
          });
        }
      };

      window.triggerRoute = function (fromXYZ, toXYZ, durationSec = 5) {
        if (trafficSocket.readyState !== WebSocket.OPEN) {
          console.warn("WebSocket Elixir belum terhubung!");
          return;
        }
        const pushMsg = JSON.stringify([
          "1",
          "2",
          "traffic:lobby",
          "send_route",
          { from: fromXYZ, to: toXYZ, duration: durationSec },
        ]);
        trafficSocket.send(pushMsg);
      };

      function updateTrafficRoutes() {
        const now = Date.now();
        for (let i = activeRoutes.length - 1; i >= 0; i--) {
          const route = activeRoutes[i];
          const elapsed = now - route.startTime;
          const progress = Math.min(elapsed / route.durationMs, 1.0);

          route.fleet.position.lerpVectors(route.from, route.to, progress);

          if (progress >= 1.0) {
            scene.remove(route.fleet);
            scene.remove(route.line);
            route.line.geometry.dispose();
            activeRoutes.splice(i, 1);
          }
        }
      }

      // --- MENGAMBIL SELURUH DATA 1D ARRAY DARI BACKEND 1 ---
      async function loadMapNodes() {
        try {
          // Menghapus parameter ?minX=... agar memuat 1000 planet sekaligus
          const response = await fetch(MAP_API_URL);
          const nodes = await response.json();

          nodes.forEach((data) => {
            // Destructuring array murni: [id, x, y, z, level, type, patrols]
            const [id, x, y, z, level, type, patrols] = data;

            // Logika material: 1 = tambang, 0 = base
            const mat = type === 1 ? tambangMat : baseMat;
            const nodeMesh = new THREE.Mesh(baseGeo, mat);
            nodeMesh.position.set(x, y, z);

            const scaleFactor = LEVEL_SCALES[level] || 1;
            nodeMesh.scale.setScalar(scaleFactor);

            // Menyimpan koordinat XYZ di userData agar tidak perlu fetch ulang saat diklik
            nodeMesh.userData = {
              id: id,
              scaleFactor: scaleFactor,
              x: x,
              y: y,
              z: z,
            };

            scene.add(nodeMesh);
            clickableObjects.push(nodeMesh);

            // Procedural Rendering untuk Patroli
            if (patrols > 0) {
              for (let p = 0; p < patrols; p++) {
                const pColor = type === 1 ? 0xf59e0b : 0xff4757;

                // Radius kita lebarkan sedikit untuk tiap armada tambahan agar tidak saling tabrak
                const pRadius = (1.2 + p * 0.3) * scaleFactor;

                // Variasi kecepatan
                const pSpeed = 0.5 + p * 0.2;

                // Tilt (gelombang vertikal)
                const pTilt = p * 0.3;

                // Tambahkan offset sudut agar armada 1 dan 2 posisinya berseberangan (180 derajat)
                const pOffset = p * Math.PI;

                const patrolMesh = new THREE.Mesh(
                  patrolGeo,
                  getPatrolMaterial(pColor),
                );

                activePatrols.push({
                  mesh: patrolMesh,
                  baseX: x,
                  baseY: y,
                  baseZ: z,
                  speed: pSpeed,
                  radius: pRadius,
                  tilt: pTilt,
                  offset: pOffset, 
                });

                scene.add(patrolMesh);
              }
            }
          });
        } catch (err) {
          console.error("Gagal memuat data peta dari Backend 1 (8081):", err);
        }
      }

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const infoPanel = document.getElementById("infoPanel");
      const infoText = document.getElementById("infoText");
      let selectedNodeMesh = null;

      window.addEventListener("click", async (e) => {
        if (e.target.tagName === "BUTTON") return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(clickableObjects);

        if (intersects.length > 0) {
          selectedNodeMesh = intersects[0].object;
          const nodeId = selectedNodeMesh.userData.id;

          // Mengambil posisi dari userData lokal untuk ditampilkan di UI
          const { x, y, z } = selectedNodeMesh.userData;

          selectionRing.position.copy(selectedNodeMesh.position);
          selectionRing.scale.setScalar(selectedNodeMesh.userData.scaleFactor);
          selectionRing.visible = true;

          infoText.innerHTML = "Memuat detail...";
          infoPanel.style.display = "block";

          // --- MENGAMBIL DATA DETAIL DARI BACKEND 2 (PORT 8080) ---
          try {
            const res = await fetch(`${DETAIL_API_URL}?id=${nodeId}`);

            // Pencegahan panel morat-marit jika ID tidak ditemukan di Backend 2
            if (!res.ok) {
              throw new Error("Data tidak ditemukan");
            }

            const detail = await res.json();

            // Struktur UI yang disesuaikan dengan response JSON Backend 2
            infoText.innerHTML = `
                        <h4>${detail.name}</h4>
                        <b>Tipe:</b> ${detail.type_name}<br>
                        <b>Pemilik:</b> ${detail.owner}<br>
                        <b>Poin Wilayah:</b> ${detail.points} pts<br>
                        <b>Info:</b> ${detail.description}<br>
                        <b>Koordinat:</b> (${x}, ${y}, ${z})
                    `;
          } catch (err) {
            infoText.innerHTML = "Gagal mengambil data detail dari server.";
          }
        } else {
          selectedNodeMesh = null;
          selectionRing.visible = false;
          infoPanel.style.display = "none";
        }
      });

      const toggleBtn = document.getElementById("toggleBtn");
      toggleBtn.addEventListener("click", () => {
        gridMesh.visible = !gridMesh.visible;
        toggleBtn.innerText = gridMesh.visible
          ? "Sembunyikan Kubus"
          : "Tampilkan Kubus";
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        const elapsedTime = clock.getElapsedTime();

        if (selectionRing.visible) {
          selectionRing.rotation.z = elapsedTime * 0.8;
        }

        for (let i = 0; i < activePatrols.length; i++) {
          const p = activePatrols[i];

          const time = elapsedTime * p.speed + p.offset;

          p.mesh.position.x = p.baseX + Math.cos(time) * p.radius;
          p.mesh.position.z = p.baseZ + Math.sin(time) * p.radius;
          p.mesh.position.y = p.baseY + Math.sin(time * 1.5) * p.tilt;
        }

        updateTrafficRoutes();

        if (selectedNodeMesh) {
          const vector = selectedNodeMesh.position.clone();
          vector.project(camera);

          if (vector.z > 1) {
            infoPanel.style.display = "none";
          } else {
            infoPanel.style.display = "block";
            infoPanel.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
            infoPanel.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
          }
        }

        renderer.render(scene, camera);
      }

      loadMapNodes();
      animate();
    </script>
  </body>
</html>
