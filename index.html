<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ Grid - Level & Resource Types</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #030712;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        #toggleBtn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            padding: 8px 14px;
            background: #38bdf8;
            color: #030712;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        #infoPanel {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            padding: 8px 12px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #38bdf8;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            transform: translate(-50%, -125%);
            pointer-events: none;
            white-space: nowrap;
        }

        #infoPanel h4 {
            color: #38bdf8;
            margin-bottom: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <button id="toggleBtn">Tampilkan Kubus</button>
    <div id="infoPanel">
        <p id="infoText"></p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030712);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(28, 22, 36);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const clock = new THREE.Clock();

        const GRID_SIZE = 10;
        const CUBE_SIZE = 1.0;
        const SPACING = 1.0;

        // --- GRID SINGLE DRAW CALL ---
        const gridPositions = [];
        const baseBoxGeo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
        const baseEdgesGeo = new THREE.EdgesGeometry(baseBoxGeo);
        const posAttr = baseEdgesGeo.attributes.position;

        for (let x = -GRID_SIZE; x <= GRID_SIZE; x++) {
            for (let y = -GRID_SIZE; y <= GRID_SIZE; y++) {
                for (let z = -GRID_SIZE; z <= GRID_SIZE; z++) {
                    for (let i = 0; i < posAttr.count; i++) {
                        gridPositions.push(
                            posAttr.getX(i) + x * SPACING,
                            posAttr.getY(i) + y * SPACING,
                            posAttr.getZ(i) + z * SPACING
                        );
                    }
                }
            }
        }

        const singleGridGeo = new THREE.BufferGeometry();
        singleGridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPositions, 3));
        const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.05 });
        const gridMesh = new THREE.LineSegments(singleGridGeo, lineMat);
        gridMesh.visible = false;
        scene.add(gridMesh);

        // --- CINCIN SELEKSI ---
        const ringGeo = new THREE.RingGeometry(0.50, 0.56, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
        const selectionRing = new THREE.Mesh(ringGeo, ringMat);
        selectionRing.rotation.x = Math.PI / 2;
        selectionRing.visible = false;
        scene.add(selectionRing);

        // --- SKALA LEVEL UKURAN (Level 4 pas seukuran kubus 1.0) ---
        // Radius geometri dasar diset 0.48 (diameter ~0.96)
        const baseGeo = new THREE.SphereGeometry(0.48, 14, 14);
        const baseMat = new THREE.MeshBasicMaterial({ color: 0xff4757 });     // Merah = Base / Desa
        const tambangMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });  // Oranye/Emas = Tambang

        const LEVEL_SCALES = {
            1: 0.35, // Level 1 (Kecil)
            2: 0.55, // Level 2 (Sedang)
            3: 0.75, // Level 3 (Besar)
            4: 1.00  // Level 4 (Maksimal - Pas seukuran kubus)
        };

        const patrolGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const materialCache = {};

        function getPatrolMaterial(hexColor) {
            if (!materialCache[hexColor]) {
                materialCache[hexColor] = new THREE.MeshBasicMaterial({ color: hexColor });
            }
            return materialCache[hexColor];
        }

        // --- GENERATOR DATA 500 OBJECT (BASE & TAMBANG WITH LEVELS) ---
        function generate500Nodes(count, maxRange) {
            const result = [];
            const used = new Set();
            const colors = [0x38bdf8, 0xfacc15, 0x2ecc71, 0xe879f9, 0xf97316];

            while (result.length < count) {
                const x = Math.floor(Math.random() * (maxRange * 2 + 1)) - maxRange;
                const y = Math.floor(Math.random() * (maxRange * 2 + 1)) - maxRange;
                const z = Math.floor(Math.random() * (maxRange * 2 + 1)) - maxRange;

                const key = `${x},${y},${z}`;
                if (used.has(key)) continue;
                used.add(key);

                // Pembagian tipe: 70% Base/Desa, 30% Tambang Sumber Daya
                const isTambang = Math.random() < 0.3;
                const type = isTambang ? 'tambang' : 'base';
                const level = Math.floor(Math.random() * 4) + 1; // Level 1 - 4
                const name = isTambang ? `Tambang Sumber Daya #${result.length + 1}` : `Desa Pemain #${result.length + 1}`;

                const pCount = isTambang ? Math.floor(Math.random() * 2) : Math.floor(Math.random() * 3);
                const patrols = [];
                for (let i = 0; i < pCount; i++) {
                    patrols.push({
                        speed: 0.8 + Math.random() * 1.2,
                        radius: (0.35 + Math.random() * 0.2) * LEVEL_SCALES[level],
                        color: colors[i % colors.length],
                        tilt: Math.random() * 0.6
                    });
                }

                result.push({ name, type, level, x, y, z, patrols });
            }
            return result;
        }

        const mapNodesData = generate500Nodes(500, GRID_SIZE);

        // --- SPAWN OBJEK ---
        const clickableObjects = [];
        const activePatrols = [];

        mapNodesData.forEach(data => {
            const baseX = data.x * SPACING;
            const baseY = data.y * SPACING;
            const baseZ = data.z * SPACING;

            // Pilih material berdasarkan tipe objek
            const mat = data.type === 'tambang' ? tambangMat : baseMat;
            const nodeMesh = new THREE.Mesh(baseGeo, mat);
            nodeMesh.position.set(baseX, baseY, baseZ);

            // Set ukuran skala berdasarkan Level (1 - 4)
            const scaleFactor = LEVEL_SCALES[data.level];
            nodeMesh.scale.setScalar(scaleFactor);

            nodeMesh.userData = {
                name: data.name,
                type: data.type === 'tambang' ? 'Tambang' : 'Desa Base',
                level: data.level,
                x: data.x,
                y: data.y,
                z: data.z,
                patrolCount: data.patrols.length,
                scaleFactor: scaleFactor
            };

            scene.add(nodeMesh);
            clickableObjects.push(nodeMesh);

            data.patrols.forEach(pData => {
                const patrolMesh = new THREE.Mesh(patrolGeo, getPatrolMaterial(pData.color));
                activePatrols.push({
                    mesh: patrolMesh,
                    baseX, baseY, baseZ,
                    speed: pData.speed,
                    radius: pData.radius,
                    tilt: pData.tilt || 0
                });
                scene.add(patrolMesh);
            });
        });

        // --- RAYCASTING EVENT KLIK ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoPanel = document.getElementById('infoPanel');
        const infoText = document.getElementById('infoText');
        let selectedNodeMesh = null;

        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                selectedNodeMesh = intersects[0].object;
                const data = selectedNodeMesh.userData;

                // Cincin seleksi menyesuaikan ukuran level objek
                selectionRing.position.copy(selectedNodeMesh.position);
                selectionRing.scale.setScalar(data.scaleFactor);
                selectionRing.visible = true;

                infoText.innerHTML = `
                    <h4>${data.name}</h4>
                    <b>Tipe:</b> ${data.type}<br>
                    <b>Level Ukuran:</b> Level ${data.level} / 4<br>
                    <b>Koordinat:</b> (${data.x}, ${data.y}, ${data.z})<br>
                    <b>Patroli:</b> ${data.patrolCount} Unit
                `;
                infoPanel.style.display = 'block';
            } else {
                selectedNodeMesh = null;
                selectionRing.visible = false;
                infoPanel.style.display = 'none';
            }
        });

        // Toggle Grid
        const toggleBtn = document.getElementById('toggleBtn');
        toggleBtn.addEventListener('click', () => {
            gridMesh.visible = !gridMesh.visible;
            toggleBtn.innerText = gridMesh.visible ? 'Sembunyikan Kubus' : 'Tampilkan Kubus';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const elapsedTime = clock.getElapsedTime();

            if (selectionRing.visible) {
                selectionRing.rotation.z = elapsedTime * 0.8;
            }

            for (let i = 0; i < activePatrols.length; i++) {
                const p = activePatrols[i];
                const time = elapsedTime * p.speed;
                p.mesh.position.x = p.baseX + Math.cos(time) * p.radius;
                p.mesh.position.z = p.baseZ + Math.sin(time) * p.radius;
                p.mesh.position.y = p.baseY + Math.sin(time * 1.5) * p.tilt;
            }

            if (selectedNodeMesh) {
                const vector = selectedNodeMesh.position.clone();
                vector.project(camera);

                if (vector.z > 1) {
                    infoPanel.style.display = 'none';
                } else {
                    infoPanel.style.display = 'block';
                    infoPanel.style.left = `${(vector.x * 0.5 + 0.5) * window.innerWidth}px`;
                    infoPanel.style.top = `${(-(vector.y * 0.5) + 0.5) * window.innerHeight}px`;
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
